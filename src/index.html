<!doctype html>
<html lang="fr" data-profil="college">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'">
  <meta name="theme-color" content="#1f4f8f">
  <title>Sablio – prototype</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icones/favicon.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="entete">
    <div class="horloge">
      <span class="heure" data-champ="heure">–</span>
      <span class="simulee" data-champ="simulee" hidden>heure simulée</span>
    </div>
    <p class="date" data-champ="date"></p>
    <nav class="vues" aria-label="Vues">
      <button type="button" data-action="vue" data-vue="maintenant" aria-current="page">Maintenant</button>
      <button type="button" data-action="vue" data-vue="jour">Jour</button>
      <button type="button" data-action="vue" data-vue="semaine">Semaine</button>
    </nav>
    <div class="commandes">
      <button type="button" class="discret" data-action="discret" aria-pressed="false">Mode discret</button>
      <label class="profil">Profil
        <select id="profil">
          <option value="primaire">Primaire</option>
          <option value="college">Collège</option>
          <option value="superieur">Supérieur</option>
        </select>
      </label>
      <button type="button" class="mise-en-avant" data-action="installer" hidden>Installer l’application</button>
      <button type="button" class="mise-en-avant" data-action="activer-rappels" hidden>Activer les rappels</button>
      <button type="button" class="mise-en-avant" data-action="reprendre-sauvegarde" hidden>Reprendre la sauvegarde</button>
      <button type="button" data-action="compact">Mode compact</button>
      <button type="button" data-action="plein-ecran" title="F11">Plein écran</button>
      <button type="button" data-action="outils" aria-expanded="false" aria-controls="outils">Outils</button>
    </div>
  </header>

  <p class="alerte-globale" id="alerte" role="alert" hidden></p>

  <main class="tableau" id="vue-maintenant">
    <section id="maintenant" class="carte carte-maintenant" aria-live="polite"></section>
    <section id="ensuite" class="carte carte-ensuite"></section>
    <section id="frise" class="carte carte-frise" aria-label="Frise de la journée"></section>
    <section id="devoirs" class="carte carte-devoirs"></section>
  </main>

  <main class="vue-jour" id="vue-jour" hidden>
    <div class="jour-entete">
      <!-- Partie reconstruite à chaque changement ; le formulaire reste en place
           pour ne pas perdre ce qu'on est en train de taper. -->
      <div class="jour-entete-dyn" id="jour-entete"></div>
      <form class="aller" id="aller" autocomplete="off" data-cible="jour">
        <label for="aller-saisie">Aller à</label>
        <input id="aller-saisie" placeholder="48, 25/12, demain…" aria-describedby="aller-erreur"
          title="Semaine (48, 48/2027), date (25/12, 25 décembre) ou jour (demain, lundi)">
        <button type="submit">Aller</button>
        <span class="erreur" id="aller-erreur" role="alert" hidden></span>
      </form>
    </div>
    <section id="jour-edt" class="carte jour-edt" aria-label="Emploi du temps du jour"></section>
    <section id="jour-devoirs" class="carte jour-devoirs" aria-label="Devoirs du jour"></section>
    <section id="jour-sac" class="carte jour-sac" aria-label="Sac à préparer"></section>
  </main>

  <main class="vue-semaine" id="vue-semaine" hidden>
    <div class="semaine-entete">
      <div class="semaine-entete-dyn" id="semaine-entete"></div>
      <form class="aller" autocomplete="off" data-cible="semaine">
        <label for="aller-semaine-saisie">Aller à</label>
        <input id="aller-semaine-saisie" placeholder="48, 25/12, lundi…"
          title="Semaine (48, 48/2027), date (25/12, 25 décembre) ou jour (demain, lundi)">
        <button type="submit">Aller</button>
        <span class="erreur" role="alert" hidden></span>
      </form>
    </div>
    <section class="semaine-grille" id="semaine-grille" aria-label="Jours de la semaine"></section>
  </main>

  <dialog id="ajout" class="large" aria-labelledby="ajout-titre">
    <form method="dialog" class="formulaire">
      <h2 id="ajout-titre">Nouveau devoir</h2>
      <fieldset class="rendu">
        <legend>À rendre</legend>
        <div class="choix-jours" id="ajout-jours" role="radiogroup" aria-label="Jour"></div>
        <label class="autre-date">Autre date <input type="date" id="ajout-date"></label>
        <div class="choix-seances" id="ajout-seances" role="radiogroup" aria-label="Cours"></div>
        <p class="erreur" id="ajout-erreur-rendu" hidden>Choisissez le cours où le rendre, ou « Sans cours précis ».</p>
      </fieldset>
      <label id="ajout-champ-matiere">Matière <select id="ajout-matiere"></select></label>
      <div class="champ">
        <span class="libelle" id="ajout-texte-libelle">Travail</span>
        <div class="barre-outils" role="toolbar" aria-label="Mise en forme">
          <button type="button" data-format="bold" title="Gras (Ctrl+B)"><strong>G</strong></button>
          <button type="button" data-format="italic" title="Italique (Ctrl+I)"><em>I</em></button>
          <button type="button" data-format="underline" title="Souligné (Ctrl+U)"><u>S</u></button>
          <button type="button" data-format="insertUnorderedList" title="Liste à puces">• Liste</button>
          <button type="button" data-format="insertOrderedList" title="Liste numérotée">1. Liste</button>
          <button type="button" data-format="removeFormat" title="Enlever la mise en forme">Effacer la forme</button>
        </div>
        <div id="ajout-texte" class="editeur contenu" contenteditable="true" role="textbox" aria-multiline="true"
          aria-labelledby="ajout-texte-libelle" data-vide="Exercices 4 et 5 p. 82, ou le texte collé depuis l’ENT"></div>
        <p class="erreur" id="ajout-erreur" hidden>Écrivez le travail à faire.</p>
      </div>
      <label id="ajout-champ-afaire"><span>À faire le <span class="facultatif">(facultatif)</span></span> <input type="date" id="ajout-afaire"></label>
      <div class="ligne boutons">
        <button value="ok" class="mise-en-avant" id="ajout-valider">Ajouter</button>
        <button value="annuler" formnovalidate>Annuler</button>
      </div>
    </form>
  </dialog>

  <dialog id="detail" class="large" aria-labelledby="detail-titre">
    <div class="detail-entete">
      <span id="detail-pastille"></span>
      <div>
        <h2 id="detail-titre"></h2>
        <p class="detail-echeance" id="detail-echeance"></p>
      </div>
    </div>
    <div class="contenu detail-contenu" id="detail-contenu"></div>
    <dl class="detail-infos" id="detail-infos"></dl>
    <div class="ligne boutons">
      <label class="bascule-fait"><input type="checkbox" id="detail-fait"> Fait</label>
      <span class="espace"></span>
      <button type="button" data-action="modifier-devoir">Modifier</button>
      <button type="button" data-action="supprimer-devoir">Supprimer</button>
      <button type="button" class="mise-en-avant" data-action="fermer-detail" autofocus>Fermer</button>
    </div>
  </dialog>

  <button type="button" class="sortir-compact" data-action="compact" title="Revenir à la fenêtre normale">Agrandir</button>

  <aside id="outils" class="outils" hidden aria-label="Outils du prototype">
    <div class="outils-tete">
      <h2>Outils</h2>
      <button type="button" data-action="outils">Fermer</button>
    </div>

    <h3>Réglages du profil</h3>
    <div class="ligne">
      <label>Mode discret
        <select id="discret-mode">
          <option value="manuel">Manuel</option>
          <option value="automatique">Automatique (pendant les cours)</option>
          <option value="toujours">Toujours actif</option>
        </select>
      </label>
    </div>
    <div class="ligne">
      <label><input type="checkbox" id="reglage-afaire"> Proposer « à faire le » à la saisie d’un devoir</label>
    </div>

    <h3>Heure simulée</h3>
    <div class="ligne">
      <input type="datetime-local" id="heure-simulee">
      <button type="button" data-action="heure-appliquer">Appliquer</button>
    </div>
    <div class="ligne">
      <button type="button" data-action="avancer" data-minutes="5">+5 min</button>
      <button type="button" data-action="avancer" data-minutes="30">+30 min</button>
      <button type="button" data-action="avancer" data-minutes="60">+1 h</button>
      <button type="button" data-action="avancer" data-minutes="1440">+1 jour</button>
    </div>
    <div class="ligne">
      <label>Vitesse
        <select id="vitesse">
          <option value="1">× 1</option>
          <option value="60">× 60 (1 min par seconde)</option>
          <option value="600">× 600</option>
        </select>
      </label>
      <button type="button" data-action="heure-reelle">Heure réelle</button>
    </div>

    <h3>Données</h3>
    <dl class="environnement" id="donnees"></dl>
    <div class="ligne">
      <button type="button" data-action="choisir-sauvegarde">Choisir le fichier de sauvegarde…</button>
      <button type="button" data-action="sauvegarder">Sauvegarder maintenant</button>
    </div>
    <div class="ligne">
      <button type="button" data-action="restaurer">Restaurer depuis un fichier…</button>
      <button type="button" data-action="perte">Simuler une perte de données</button>
    </div>
    <div class="ligne">
      <button type="button" data-action="reinitialiser">Réinitialiser la démonstration</button>
    </div>

    <h3>Essais</h3>
    <div class="ligne">
      <button type="button" data-action="test-notification">Notification</button>
      <button type="button" data-action="test-son">Son</button>
      <button type="button" data-action="test-fluidite">Fluidité</button>
    </div>
    <div class="ligne">
      <button type="button" data-action="test-sqlite">SQLite (dossier de l’application)</button>
      <button type="button" data-action="test-sqlite-dossier">SQLite (autre dossier…)</button>
    </div>
    <ol class="journal" id="journal"></ol>

    <h3>Environnement</h3>
    <dl class="environnement" id="environnement"></dl>
    <button type="button" data-action="copier-rapport">Copier le rapport</button>
  </aside>
</body>
</html>
